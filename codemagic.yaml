workflows:
  android-debug:
    name: Build Android Debug APK
    max_build_duration: 60
    environment:
      java: 17
      vars:
        GRADLE_VERSION: "8.9"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
        - $CM_BUILD_DIR/.ci/gradle
    scripts:
      - name: Show build environment
        script: |
          set -e
          java -version
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "CM_BUILD_DIR=$CM_BUILD_DIR"

      - name: Configure Android SDK
        script: |
          set -e
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          cat "$CM_BUILD_DIR/local.properties"

      - name: Install Gradle 8.9 locally
        script: |
          set -e
          mkdir -p "$CM_BUILD_DIR/.ci/gradle"
          if [ ! -x "$CM_BUILD_DIR/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle" ]; then
            curl --fail --location --retry 3 \
              "https://services.gradle.org/distributions/gradle-$GRADLE_VERSION-bin.zip" \
              --output "$CM_BUILD_DIR/.ci/gradle/gradle-$GRADLE_VERSION-bin.zip"
            unzip -q -o "$CM_BUILD_DIR/.ci/gradle/gradle-$GRADLE_VERSION-bin.zip" \
              -d "$CM_BUILD_DIR/.ci/gradle"
          fi
          "$CM_BUILD_DIR/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle" --version

      - name: Run unit tests
        script: |
          set -e
          "$CM_BUILD_DIR/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle" \
            --no-daemon --stacktrace testDebugUnitTest

      - name: Build debug APK
        script: |
          set -e
          "$CM_BUILD_DIR/.ci/gradle/gradle-$GRADLE_VERSION/bin/gradle" \
            --no-daemon --stacktrace assembleDebug
          test -f "$CM_BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk"
          sha256sum "$CM_BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk" \
            | tee "$CM_BUILD_DIR/app/build/outputs/apk/debug/app-debug.apk.sha256"

    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/outputs/apk/debug/*.sha256
      - app/build/reports/tests/**
      - app/build/test-results/**
